name: Translate profile README

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - scripts/translate_readme.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translate-profile-readme
  cancel-in-progress: true

jobs:
  translate:
    runs-on: ubuntu-latest

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-6-luna

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify translation secret
        shell: bash
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Missing repository secret OPENAI_API_KEY."
            echo "Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install translation dependency
        run: python -m pip install --upgrade openai

      - name: Regenerate localized READMEs
        run: python scripts/translate_readme.py

      - name: Commit updated translations
        shell: bash
        run: |
          if git diff --quiet -- README.pt-BR.md README.es.md README.ru.md; then
            echo "Translations are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.pt-BR.md README.es.md README.ru.md
          git commit -m "docs: sync translated profile READMEs"
          git push
